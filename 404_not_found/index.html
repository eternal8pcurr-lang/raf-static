			/* ============================================
   REAL ASSETS FOUNDATION — Modal Popup Styles
   Paste this in: Header & Footer Scripts → HEADER
   ============================================ */

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap');

:root {
  --raf-navy:   #1A2E4A;
  --raf-gold:   #B8962E;
  --raf-gold-lt:#D4AF4A;
  --raf-mid:    #2E5D8E;
  --raf-cream:  #FAF8F4;
  --raf-line:   rgba(184,150,46,0.25);
  --raf-text:   #2C2C2C;
  --raf-muted:  #6B7280;
  --raf-radius: 4px;
  --raf-shadow: 0 24px 64px rgba(26,46,74,0.18), 0 4px 16px rgba(26,46,74,0.10);
}

/* ── overlay ── */
#raf-modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,18,30,0.65);
  backdrop-filter: blur(4px);
  z-index: 9998;
  opacity: 0;
  transition: opacity 0.3s ease;
}
#raf-modal-overlay.active {
  display: block;
  opacity: 1;
}

/* ── modal panel ── */
#raf-modal {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -46%);
  width: min(680px, 94vw);
  max-height: 88vh;
  background: var(--raf-cream);
  border-radius: 6px;
  box-shadow: var(--raf-shadow);
  z-index: 9999;
  opacity: 0;
  transition: opacity 0.3s ease, transform 0.3s ease;
  overflow: hidden;
}
#raf-modal.active {
  display: block;
  opacity: 1;
  transform: translate(-50%, -50%);
}

/* scrollable inner */
.raf-modal-inner {
  overflow-y: auto;
  max-height: 88vh;
  padding: 48px 48px 40px;
}

/* ── close button ── */
.raf-modal-close {
  position: absolute;
  top: 16px;
  right: 20px;
  background: none;
  border: none;
  font-size: 26px;
  color: var(--raf-muted);
  cursor: pointer;
  line-height: 1;
  padding: 4px 8px;
  transition: color 0.2s;
  z-index: 10;
}
.raf-modal-close:hover { color: var(--raf-navy); }

/* ── header row ── */
.raf-modal-header {
  display: flex;
  align-items: flex-start;
  gap: 24px;
  margin-bottom: 28px;
}

/* avatar circle */
.raf-modal-avatar {
  flex-shrink: 0;
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: var(--raf-navy);
  color: var(--raf-gold);
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  letter-spacing: 0.04em;
}

/* identity block */
.raf-modal-tag {
  font-family: 'DM Sans', sans-serif;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--raf-gold);
  margin-bottom: 6px;
}
#raf-modal-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 30px;
  font-weight: 700;
  color: var(--raf-navy);
  margin: 0 0 6px;
  line-height: 1.15;
}
.raf-modal-title {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  color: var(--raf-muted);
  margin: 0;
  font-style: italic;
}

/* ── gold divider ── */
.raf-modal-divider {
  height: 1px;
  background: var(--raf-line);
  margin-bottom: 28px;
}

/* ── bio body ── */
.raf-modal-body {
  font-family: 'DM Sans', sans-serif;
  font-size: 14.5px;
  line-height: 1.8;
  color: var(--raf-text);
}
.raf-modal-body p {
  margin: 0 0 16px;
}
.raf-modal-body p:last-child { margin-bottom: 0; }

/* ── optional footer links ── */
.raf-modal-footer {
  margin-top: 28px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.raf-modal-link {
  display: inline-block;
  padding: 8px 20px;
  border: 1px solid var(--raf-navy);
  color: var(--raf-navy);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-decoration: none;
  text-transform: uppercase;
  border-radius: var(--raf-radius);
  transition: background 0.2s, color 0.2s;
}
.raf-modal-link:hover {
  background: var(--raf-navy);
  color: var(--raf-gold);
}

/* ── scroll lock when modal open ── */
body.raf-no-scroll { overflow: hidden; }

/* ── responsive ── */
@media (max-width: 600px) {
  .raf-modal-inner { padding: 36px 24px 32px; }
  .raf-modal-header { flex-direction: column; gap: 16px; }
  #raf-modal-name { font-size: 24px; }
}
.raf-modal-video {
  margin-top: 24px;
}
.raf-modal-video iframe {
  width: 100%;
  aspect-ratio: 16 / 9;
  border: none;
  border-radius: 4px;
}
section.mission-section,
div.mission-section {
  background-image: radial-gradient(ellipse 80% 50% at 50% 50%, hsla(42, 78%, 55%, 0.07) 0%, transparent 70%) !important;
}
.hero-cover {
  position: relative;
}
.wp-block-cover::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(to right, transparent, hsla(42, 78%, 55%, 0.2), transparent);
}
/* Form container */
#srfm-form-2668 {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid hsla(42, 78%, 55%, 0.3);
  border-radius: 12px;
  padding: 32px;
}

/* All inputs and textarea */
.srfm-input-common {
  background: rgba(255, 255, 255, 0.05) !important;
  border: 1px solid hsla(42, 78%, 55%, 0.2) !important;
  border-radius: 6px !important;
  color: #fff !important;
  padding: 12px 16px !important;
  width: 100% !important;
}

/* Focus state */
.srfm-input-common:focus {
  border-color: hsla(42, 78%, 55%, 0.6) !important;
  outline: none !important;
  box-shadow: none !important;
}

/* Placeholder text */
.srfm-input-common::placeholder {
  color: rgba(255, 255, 255, 0.35) !important;
}

/* Submit button */
#srfm-submit-btn {
  background: hsla(42, 78%, 55%, 1) !important;
  color: #000 !important;
  border: none !important;
  border-radius: 6px !important;
  padding: 14px 24px !important;
  width: 100% !important;
  font-weight: 600 !important;
  letter-spacing: 0.1em !important;
  text-transform: uppercase !important;
  cursor: pointer !important;
}

#srfm-submit-btn:hover {
  background: hsla(42, 78%, 65%, 1) !important;
}		</style>

    video: "",
    body: "<p>Ferananda Ibarra, Director of the Commons Engine, is a visionary social innovator and regenerative entrepreneur, bringing over fifteen years of experience with community building and currency design. Her background in collective intelligence, integral theories, and deep wealth design inform her creativity and facilitation of systems and organizations that can address our global challenges.</p>",

    title: "Architect of the Real Asset Mechanics",
    video: "https://www.youtube.com/embed/XH2dV33shxE",
    body: "<p>Arthur Brock builds targeted currencies which shape the social dynamics of our emerging post-industrial economy. He has created more than a hundred designs for multi-currency systems, and his software company has built and deployed dozens of those systems. His designs include currencies for: collaborative scientific research, sustainable fishery management, corporate compensation plans, employee stock options, community-based economic development, business barter and exchange, triple-bottom-line trade credits, open source software development, customer loyalty programs, water rights, recirculating gift certificates, community service, employee performance management, arts and culture development, efficient resource sharing and management, and community and environmental impact assessment. He is currently launching Holochain, an alternative to blockchain for running fully P2P distributed applications.</p>",

  ken: {

    title: "Originator of RealGold Concepts",
    video: "",
    body: "<p>Ken Currington brings an uncommon combination of operational leadership, human development, and systems thinking to his role as Executive Director of Real Assets Foundation. As a former CEO in both machine manufacturing and health supplements, he has spent decades building and scaling companies that operate at the intersection of physical production and human wellbeing. Ken holds a degree in psychology and has worked extensively with high-profile individuals at an elite retreat center, where his integrated approach to yoga and psychological development earned him a distinguished reputation among leaders and performers seeking clarity and transformation. </p><p>It is precisely this blend of operational experience and deep human insight that led Ken to originate the RealGold system — rooted in a fundamental conviction that the earth already holds the store of value, and that value does not require destruction to be realized. Land does not need to be consumed to be worth something. It needs to be respected, regenerated, and properly reflected in the currencies we use to measure wealth. Ken calls this principle Earth Based Currencies — the idea that real-world financial instruments should reflect how well we take care of the earth, not how efficiently we extract from it. Real Assets Foundation is the institutional expression of that conviction: a structure that makes in-situ minerals certifiable and tradeable as real property, while keeping the land and its regenerative capacity intact in perpetuity.</p>",

    iframe.setAttribute('allowfullscreen', '');
    iframe.style.width = '100%';
    iframe.style.aspectRatio = '16/9';
    iframe.style.border = 'none';
    iframe.style.borderRadius = '4px';
    iframe.style.marginBottom = '20px';

    videoEl.appendChild(iframe);

  document.body.classList.add('raf-no-scroll');
